<!-- index.html (Login Page) - overwrite existing file -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Xspace &amp; Co. — Login</title>
  <meta name="description" content="Xspace private portal login" />
  <style>
    :root{
      --bg:#fff; --fg:#0b0b0b; --muted:#6b6b6b; --card-radius:12px; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto;
      --line:rgba(0,0,0,0.08); --soft:rgba(0,0,0,0.03);
    }
    [data-theme="dark"]{ --bg:#000; --fg:#fff; --muted:#9a9a9a; --line:rgba(255,255,255,0.10); --soft:rgba(255,255,255,0.04); }
    html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;}
    .center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
    .card{width:100%;max-width:460px;padding:32px;border-radius:var(--card-radius);box-sizing:border-box;}
    .brand{text-align:center;margin-bottom:14px}
    .brand .title{font-size:28px;font-weight:700}
    .brand .sub{font-size:13px;color:var(--muted);margin-top:6px}
    form{display:flex;flex-direction:column;gap:12px}
    label{font-size:13px;color:var(--muted)}
    input{padding:12px 14px;border-radius:10px;border:1px solid var(--line);font-size:15px;width:100%;box-sizing:border-box;background:transparent;color:var(--fg)}
    .controls{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
    .controls input[type="checkbox"]{width:auto}
    .btn{padding:12px;border-radius:10px;border:0;background:var(--fg);color:var(--bg);font-weight:600;cursor:pointer;width:100%}
    .small{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}
    .toptoggle{position:fixed;right:18px;top:18px;padding:8px 10px;border-radius:999px;background:var(--soft);cursor:pointer}
    .err{display:none;font-size:13px;color:#b00020;background:rgba(176,0,32,.08);border:1px solid rgba(176,0,32,.2);padding:10px 12px;border-radius:10px}
    [data-theme="dark"] .err{color:#ff8a9a;background:rgba(255,138,154,.08);border-color:rgba(255,138,154,.22)}
    .demo{margin-top:22px;border:1px dashed var(--line);border-radius:12px;padding:14px}
    .demo h3{margin:0 0 4px;font-size:13px;font-weight:600}
    .demo .hint{margin:0 0 10px;font-size:12px;color:var(--muted)}
    .demo-list{display:flex;flex-direction:column;gap:6px}
    .demo-row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;font-size:12px;cursor:pointer;text-align:left}
    .demo-row:hover{background:var(--soft)}
    .demo-row .who{display:flex;flex-direction:column;gap:2px}
    .demo-row .who b{font-weight:600}
    .demo-row .who em{font-style:normal;color:var(--muted)}
    .demo-row .tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
    .pw{font-size:12px;color:var(--muted);margin-top:10px;text-align:center}
    .pw code{background:var(--soft);padding:2px 6px;border-radius:6px}
  </style>
</head>
<body>
  <div class="toptoggle" id="themeToggle" role="button" tabindex="0">☀️ Day</div>

  <main class="center">
    <section class="card" role="main" aria-labelledby="brandTitle">
      <div class="brand" id="brandTitle">
        <div class="title">Xspace &amp; Co.</div>
        <div class="sub">Portal</div>
      </div>

      <div style="text-align:center;margin-bottom:10px">
        <h2 style="margin:0;font-size:18px">Login to continue</h2>
        <div style="color:var(--muted);font-size:13px;margin-top:8px">Sign in to your private workspace</div>
      </div>

      <form id="loginForm" autocomplete="off" novalidate>
        <div class="err" id="errorBox" role="alert"></div>

        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="name@xspace.co" required />
        </div>

        <div>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Enter your password" required />
        </div>

        <div class="controls">
          <label><input id="remember" type="checkbox" /> Remember me</label>
          <a href="#" id="forgot" style="color:var(--muted);text-decoration:none">Forgot?</a>
        </div>

        <div>
          <button class="btn" type="submit" id="loginBtn">Login to Portal</button>
        </div>

        <div class="small">Private Access • Xspace team only</div>
      </form>

      <div class="demo">
        <h3>Demo accounts</h3>
        <div class="hint">Click an account to fill the form, then press Login.</div>
        <div class="demo-list" id="demoList"></div>
        <div class="pw">Password for every demo account: <code>xspace123</code></div>
      </div>

      <div class="small" style="margin-top:18px">© <span id="year"></span> Xspace &amp; Co.</div>
    </section>
  </main>

  <script>
    // ---------- DEMO AUTH (front-end only) ----------
    // These map 1:1 to the users seeded by dashboard.html (ids u1..u5),
    // so the role-based UI resolves the correct user after login.
    const DEMO_USERS = [
      {id:'u1', name:'Tej (Founder)',   email:'tej@xspace.co',     password:'xspace123', role:'founder'},
      {id:'u2', name:'Karthik (Core)',  email:'karthik@xspace.co', password:'xspace123', role:'core'},
      {id:'u3', name:'Sai (Agent)',     email:'sai@xspace.co',     password:'xspace123', role:'agent'},
      {id:'u4', name:'Priya (Creator)', email:'priya@xspace.co',   password:'xspace123', role:'creator'},
      {id:'u5', name:'Studio Team',     email:'studio@xspace.co',  password:'xspace123', role:'studio'}
    ];

    const THEME_KEY = 'xspace_theme';
    const AUTH_KEY  = 'xspace_auth'; // session flag
    document.getElementById('year').textContent = new Date().getFullYear();

    // ---------- theme ----------
    const root = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    applyTheme(localStorage.getItem(THEME_KEY) || 'light');
    function applyTheme(m){
      if(m === 'dark'){ root.setAttribute('data-theme','dark'); themeToggle.textContent = '🌙 Night'; }
      else { root.removeAttribute('data-theme'); themeToggle.textContent = '☀️ Day'; }
      localStorage.setItem(THEME_KEY, m);
    }
    themeToggle.addEventListener('click', ()=> applyTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
    themeToggle.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') themeToggle.click(); });

    // ---------- already logged in ----------
    if(localStorage.getItem(AUTH_KEY) === '1'){
      window.location.href = 'dashboard.html';
    }

    // ---------- demo credential list ----------
    const demoList = document.getElementById('demoList');
    DEMO_USERS.forEach(function(u){
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'demo-row';

      const who = document.createElement('span');
      who.className = 'who';
      const nm = document.createElement('b');
      nm.textContent = u.name;
      const em = document.createElement('em');
      em.textContent = u.email;
      who.appendChild(nm);
      who.appendChild(em);

      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = u.role;

      btn.appendChild(who);
      btn.appendChild(tag);
      btn.addEventListener('click', function(){
        document.getElementById('email').value = u.email;
        document.getElementById('password').value = u.password;
        hideError();
        document.getElementById('loginBtn').focus();
      });
      demoList.appendChild(btn);
    });

    function showError(msg){
      const box = document.getElementById('errorBox');
      box.textContent = msg;
      box.style.display = 'block';
    }
    function hideError(){ document.getElementById('errorBox').style.display = 'none'; }

    // ---------- login ----------
    document.getElementById('loginForm').addEventListener('submit', function(e){
      e.preventDefault();
      hideError();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const pass  = document.getElementById('password').value;

      if(!email || !pass){
        showError('Please enter both email and password.');
        return;
      }

      const user = DEMO_USERS.find(function(u){
        return u.email.toLowerCase() === email && u.password === pass;
      });

      if(!user){
        showError('Invalid credentials. Use one of the demo accounts listed below.');
        return;
      }

      // Demo session only. In a real app, store the token returned by the backend.
      localStorage.setItem(AUTH_KEY, '1');
      localStorage.setItem('xspace_role', user.role);
      localStorage.setItem('xspace_user_id', user.id);
      localStorage.setItem('xspace_user_email', user.email);
      localStorage.setItem('xspace_user_name', user.name);

      if(document.getElementById('remember').checked){
        localStorage.setItem('xspace_remember_email', user.email);
      } else {
        localStorage.removeItem('xspace_remember_email');
      }

      window.location.href = 'dashboard.html';
    });

    // ---------- prefill remembered email ----------
    const remembered = localStorage.getItem('xspace_remember_email');
    if(remembered){
      document.getElementById('email').value = remembered;
      document.getElementById('remember').checked = true;
    }

    // ---------- forgot (demo) ----------
    document.getElementById('forgot').addEventListener('click', function(e){
      e.preventDefault();
      alert('Demo portal — password reset is not wired up.\n\nEvery demo account uses the password: xspace123');
    });
  </script>
</body>
</html>
