<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Xspace &amp; Co | Client Intelligence</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#0b0b0b;
  --panel:#0f1720;
  --fg:#fff;
  --muted:#9aa0a6;
  --border:rgba(255,255,255,0.08);
  font-family: Inter, system-ui;
}
body{margin:0;background:var(--bg);color:var(--fg);}
.container{padding:20px;max-width:1100px;margin:auto;}

.section{background:var(--panel);border-radius:12px;padding:16px;margin-bottom:16px;}
.section h3{margin:0 0 12px;font-size:16px}
.muted{color:var(--muted);font-size:13px}

.header-top{margin-bottom:12px;}
.client-name{font-size:22px;font-weight:600}

.status-wrap{background:rgba(255,255,255,0.03);padding:10px;border-radius:10px}

.status-badge{display:inline-block;padding:6px 12px;border-radius:999px;font-size:12px}
.new{background:#1f2937}
.contacted{background:#64748b}
.presented{background:#2563eb}
.scheduled{background:#4f46e5}
.completed{background:#0ea5e9}
.negotiation{background:#f59e0b}
.token{background:#a855f7}
.closed{background:#10b981;color:#000}
.dropped{background:#374151}

.hot{color:#ef4444}
.warm{color:#f59e0b}
.cold{color:#38bdf8}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:820px){ .grid{grid-template-columns:repeat(2,1fr);} }
@media (max-width:480px){ .grid{grid-template-columns:1fr;} }
.box{background:rgba(255,255,255,0.03);padding:10px;border-radius:10px}
.box strong{display:block;font-size:12px;color:var(--muted)}

.timeline-item{border-left:2px solid rgba(255,255,255,0.1);padding-left:12px;margin-bottom:10px}
.time{font-size:12px;color:var(--muted)}

.shortlist{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:10px;
}
.short-item{
  background:rgba(255,255,255,0.04);
  padding:10px;
  border-radius:10px;
}
.short-item strong{display:block;font-size:14px}
.short-item span{font-size:12px;color:var(--muted)}

textarea,input[type="datetime-local"],select{
  width:100%;
  background:#020617;
  border:1px solid var(--border);
  color:var(--fg);
  padding:10px;
  border-radius:8px;
  box-sizing:border-box;
}
textarea{min-height:110px;font-family:inherit;font-size:13px;}
button{background:#10b981;color:#000;border:0;padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer}
.action{background:transparent;color:#10b981;border:1px solid var(--border);margin-top:6px;}
.actions button{margin-right:6px;margin-top:6px;}
.notfound{padding:40px;text-align:center;color:var(--muted);}
.readonly-note{
  background:rgba(245,158,11,.10);border:1px solid rgba(245,158,11,.35);
  color:#fbbf24;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;
}
</style>
</head>

<body>
<div class="container" id="root">

<div id="notFound" class="section notfound" style="display:none">
  This client could not be found. <a href="client.html" style="color:#10b981">Back to Clients</a>
</div>

<div id="content" style="display:none">

<div id="readonlyNote" class="readonly-note" style="display:none">
  🔒 Read-only — this client is not assigned to you.
</div>

<!-- HEADER -->
<div class="section">
  <div class="header-top">
    <div class="client-name">
      <span id="clientName">—</span> <span id="clientTemp"></span>
    </div>
    <div class="muted" id="clientPhone"></div>
    <div class="muted" id="clientSource"></div>
    <div class="muted" id="clientOwner"></div>
  </div>

  <div class="status-wrap">
    <div class="muted">Current Status</div>
    <div id="currentStatus" class="status-badge new">—</div>
    <div class="muted" id="statusTime"></div>

    <div id="presentationMode" class="muted" style="display:none;margin-top:6px">
      Presentation Mode: <strong id="presentModeLabel">—</strong>
    </div>

    <div class="actions" id="statusActions">
      <button class="action" onclick="setStatus('New')">New</button>
      <button class="action" onclick="setStatus('Contacted')">Contacted</button>

      <div style="margin-top:6px">
        <select id="presentMode">
          <option value="">Listings Presented (select mode)</option>
          <option value="Office">🏢 Office</option>
          <option value="In Person">👥 In Person</option>
          <option value="Zoom">💻 Zoom</option>
        </select>
        <button class="action" onclick="markPresented()">Mark Presented</button>
      </div>

      <button class="action" onclick="setStatus('Visit Scheduled')">Visit Scheduled</button>
      <button class="action" onclick="setStatus('Visit Completed')">Visit Completed</button>
      <button class="action" onclick="setStatus('Negotiation')">Negotiation</button>
      <button class="action" onclick="setStatus('Token/EOI')">Token / EOI</button>
      <button class="action" onclick="setStatus('Closed')">Closed</button>
      <button class="action" onclick="setStatus('Dropped')">Dropped</button>
    </div>

    <div style="margin-top:12px" id="scheduleWrap">
      <div class="muted">Schedule Site Visit</div>
      <input id="quickDate" type="datetime-local">
      <button class="action" onclick="scheduleVisit()">Schedule Site Visit</button>
    </div>
  </div>
</div>

<!-- REQUIREMENT -->
<div class="section">
  <h3>Requirement Snapshot</h3>
  <div class="grid">
    <div class="box"><strong>Budget</strong><span id="reqBudget">—</span></div>
    <div class="box"><strong>Preferred Area</strong><span id="reqArea">—</span></div>
    <div class="box"><strong>Property Type</strong><span id="reqType">—</span></div>
    <div class="box"><strong>Lead Age</strong><span id="reqAge">—</span></div>
  </div>
</div>

<!-- ACTIVITY -->
<div class="section">
  <h3>Activity Timeline</h3>
  <div id="timeline"></div>
</div>

<!-- SHORTLISTED PROJECTS -->
<div class="section">
  <h3>Shortlisted Listings</h3>
  <div class="shortlist" id="shortlist"></div>
</div>

<!-- SITE VISITS -->
<div class="section">
  <h3>Site Visits</h3>
  <div class="muted" id="visitList"></div>
</div>

<!-- NOTES -->
<div class="section">
  <h3>Internal Notes</h3>
  <textarea id="notes" placeholder="Internal notes about this client…"></textarea>
  <br><br>
  <button onclick="saveNote()" id="saveNoteBtn">Save Note</button>
  <span class="muted" id="noteSaved" style="margin-left:10px"></span>
</div>

</div>
</div>

<script src="portal-db.js"></script>
<script>
if(!XPortal.requireModule('clients')){ throw new Error('access denied'); }

var ME          = XPortal.currentUser();
var CAN_SEE_ALL = XPortal.can('data.viewAll');
var CAN_EDIT_ANY= XPortal.can('clients.edit');

var leadId = new URLSearchParams(window.location.search).get('id');
var lead   = leadId ? XPortal.find('leads', leadId) : null;

// Founder can open any client. Everyone else only their own.
var mine     = lead && lead.assignedAgent === ME.id;
var canView  = lead && (CAN_SEE_ALL || mine);
var canEdit  = lead && (CAN_EDIT_ANY || mine);

if(!lead || !canView){
  document.getElementById('notFound').style.display = 'block';
  if(lead && !canView){
    document.getElementById('notFound').textContent = 'You do not have access to this client.';
  }
} else {
  document.getElementById('content').style.display = 'block';
  boot();
}

function boot(){
  if(!canEdit){
    document.getElementById('readonlyNote').style.display = 'block';
    document.getElementById('statusActions').style.display = 'none';
    document.getElementById('scheduleWrap').style.display = 'none';
    document.getElementById('notes').readOnly = true;
    document.getElementById('saveNoteBtn').style.display = 'none';
  }

  renderHeader();
  renderRequirement();
  renderTimeline();
  renderShortlist();
  renderVisits();
  document.getElementById('notes').value = lead.notes || '';
}

/* ---------- header ---------- */
function cssForStatus(s){
  return {
    'New':'new',
    'Discovery':'new',
    'Contacted':'contacted',
    'Engaged':'contacted',
    'Listings Presented':'presented',
    'Visit Scheduled':'scheduled',
    'Site Visit':'completed',
    'Visit Completed':'completed',
    'Negotiation':'negotiation',
    'Token/EOI':'token',
    'Closed':'closed',
    'Dropped':'dropped'
  }[s] || 'new';
}

function tempLabel(t){ return { hot:'🔥 Hot', warm:'🌤️ Warm', cold:'❄️ Cold' }[t] || ''; }

function renderHeader(){
  document.getElementById('clientName').textContent = lead.name || '—';
  var temp = document.getElementById('clientTemp');
  temp.className = lead.temperature || '';
  temp.textContent = tempLabel(lead.temperature);

  document.getElementById('clientPhone').textContent  = '📞 ' + (lead.phone || '—');
  document.getElementById('clientSource').textContent = '🔗 Lead Source: ' + (lead.source || '—');
  document.getElementById('clientOwner').textContent  = '👤 Lead Owner: ' + XPortal.userName(lead.assignedAgent);

  paintStatus(lead.status || 'Discovery', lead.statusUpdatedAt);

  if(lead.presentMode){
    document.getElementById('presentationMode').style.display = 'block';
    document.getElementById('presentModeLabel').textContent = lead.presentMode;
  }
}

function paintStatus(s, ts){
  var el = document.getElementById('currentStatus');
  el.textContent = s;
  el.className = 'status-badge ' + cssForStatus(s);
  document.getElementById('statusTime').textContent =
    'Last updated: ' + (ts ? new Date(ts).toLocaleString() : '—');
}

function setStatus(s){
  if(!canEdit){ alert('You do not have permission to change this client.'); return; }
  var ts = Date.now();
  XPortal.update('leads', lead.id, { status: s, statusUpdatedAt: ts });
  lead.status = s; lead.statusUpdatedAt = ts;
  paintStatus(s, ts);
  XPortal.audit('Client ' + lead.name + ' set to ' + s + ' by ' + ME.name);
  XPortal.activity(ME.name + ' moved ' + lead.name + ' to ' + s);
  if(s !== 'Listings Presented') document.getElementById('presentationMode').style.display = 'none';
  renderTimeline();
}

function markPresented(){
  if(!canEdit){ alert('You do not have permission to change this client.'); return; }
  var mode = document.getElementById('presentMode').value;
  if(!mode){ alert('Select presentation mode'); return; }
  XPortal.update('leads', lead.id, { presentMode: mode });
  lead.presentMode = mode;
  setStatus('Listings Presented');
  document.getElementById('presentationMode').style.display = 'block';
  document.getElementById('presentModeLabel').textContent = mode;
}

/* The old link pointed at site-visits.html, which does not exist. */
function scheduleVisit(){
  var dt = document.getElementById('quickDate').value;
  if(!dt){ alert('Select date & time first'); return; }
  window.location.href = 'sitevisits.html?dt=' + encodeURIComponent(dt) + '&lead=' + encodeURIComponent(lead.id);
}

/* ---------- requirement ---------- */
function renderRequirement(){
  var listing = lead.listingId ? XPortal.find('listings', lead.listingId) : null;
  document.getElementById('reqBudget').textContent = lead.budget || '—';
  document.getElementById('reqArea').textContent   = listing ? (listing.area || '—') : '—';
  document.getElementById('reqType').textContent   = listing ? (listing.unitType || '—') : '—';

  var age = '—';
  if(lead.createdAt){
    var days = Math.floor((Date.now() - lead.createdAt) / (24 * 3600 * 1000));
    age = days <= 0 ? 'Today' : days + ' day' + (days === 1 ? '' : 's');
  }
  document.getElementById('reqAge').textContent = age;
}

/* ---------- timeline ---------- */
function renderTimeline(){
  var host = document.getElementById('timeline');
  host.innerHTML = '';

  var events = [];
  if(lead.createdAt) events.push({ label: 'Lead created — source ' + (lead.source || '—'), ts: lead.createdAt });
  if(lead.statusUpdatedAt) events.push({ label: 'Status set to ' + lead.status, ts: lead.statusUpdatedAt });

  XPortal.list('visits')
    .filter(function(v){ return v.clientId === lead.id; })
    .forEach(function(v){
      var listing = XPortal.find('listings', v.listingId);
      events.push({
        label: 'Site visit ' + (v.status || 'Scheduled') + (listing ? ' — ' + listing.title : ''),
        ts: v.scheduledAt,
        by: XPortal.userName(v.agentId)
      });
    });

  events.sort(function(a, b){ return b.ts - a.ts; });

  if(!events.length){
    host.innerHTML = '<div class="muted">No activity recorded yet.</div>';
    return;
  }

  events.forEach(function(e){
    var item = document.createElement('div');
    item.className = 'timeline-item';
    var top = document.createElement('div');
    var s = document.createElement('strong');
    s.textContent = e.label;
    top.appendChild(s);
    var t = document.createElement('div');
    t.className = 'time';
    t.textContent = new Date(e.ts).toLocaleString() + (e.by ? ' • Agent: ' + e.by : '');
    item.appendChild(top); item.appendChild(t);
    host.appendChild(item);
  });
}

/* ---------- shortlist ---------- */
function renderShortlist(){
  var host = document.getElementById('shortlist');
  host.innerHTML = '';

  var ids = [];
  if(lead.listingId) ids.push(lead.listingId);
  XPortal.list('visits')
    .filter(function(v){ return v.clientId === lead.id && v.listingId; })
    .forEach(function(v){ if(ids.indexOf(v.listingId) === -1) ids.push(v.listingId); });

  if(!ids.length){
    host.innerHTML = '<div class="muted">No listings shortlisted yet.</div>';
    return;
  }

  ids.forEach(function(id){
    var l = XPortal.find('listings', id);
    if(!l) return;
    var box = document.createElement('div');
    box.className = 'short-item';
    var s = document.createElement('strong');
    s.textContent = l.title;
    var sp = document.createElement('span');
    sp.textContent = [l.area, l.unitType, l.price].filter(Boolean).join(' • ');
    box.appendChild(s); box.appendChild(sp);
    host.appendChild(box);
  });
}

/* ---------- visits ---------- */
function renderVisits(){
  var host = document.getElementById('visitList');
  host.innerHTML = '';
  var rows = XPortal.list('visits').filter(function(v){ return v.clientId === lead.id; });

  if(!rows.length){
    host.textContent = 'No site visits recorded for this client.';
    return;
  }

  rows.sort(function(a, b){ return b.scheduledAt - a.scheduledAt; }).forEach(function(v){
    var listing = XPortal.find('listings', v.listingId);
    var line = document.createElement('div');
    line.textContent = '• ' + (listing ? listing.title : 'Listing') + ' — ' +
                       new Date(v.scheduledAt).toLocaleString() + ' (' + (v.status || 'Scheduled') + ')';
    host.appendChild(line);
  });
}

/* ---------- notes ---------- */
function saveNote(){
  if(!canEdit){ alert('You do not have permission to change this client.'); return; }
  var text = document.getElementById('notes').value;
  XPortal.update('leads', lead.id, { notes: text });
  lead.notes = text;
  XPortal.audit('Notes updated for client ' + lead.name + ' by ' + ME.name);
  var flag = document.getElementById('noteSaved');
  flag.textContent = 'Saved.';
  setTimeout(function(){ flag.textContent = ''; }, 2000);
}
</script>
  <script src="portal-nav.js"></script>
</body>
</html>
