<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Xspace &amp; Co | Teams</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: Inter, system-ui, sans-serif; }
  </style>
</head>
<body class="bg-[#0b0b0b] text-white">
  <div class="max-w-6xl mx-auto p-6">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6 gap-4 flex-wrap">
      <div>
        <h1 class="text-2xl font-semibold">Teams</h1>
        <p class="text-sm text-gray-400 mt-1" id="scopeNote"></p>
      </div>
      <button id="addBtn" onclick="toggleModal(true)" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg text-sm font-medium">
        + Add Member
      </button>
    </div>

    <!-- Founder-only notice for everyone else -->
    <div id="lockNote" class="hidden mb-4 text-sm rounded-lg border border-amber-500/35 bg-amber-500/10 text-amber-300 px-4 py-3">
      🔒 Team members can only be added or changed by the Founder account.
    </div>

    <!-- Tabs -->
    <div class="flex gap-3 mb-4 flex-wrap" id="tabs">
      <button class="tab-btn bg-[#111827] px-4 py-2 rounded-lg text-sm" data-tab="agent">Agents</button>
      <button class="tab-btn bg-[#111827] px-4 py-2 rounded-lg text-sm" data-tab="creator">Creators</button>
      <button class="tab-btn bg-[#111827] px-4 py-2 rounded-lg text-sm" data-tab="studio">Studio</button>
      <button class="tab-btn bg-[#111827] px-4 py-2 rounded-lg text-sm" data-tab="core">Core Team</button>
      <button class="tab-btn bg-[#111827] px-4 py-2 rounded-lg text-sm" data-tab="founder">Founder</button>
      <button class="tab-btn bg-[#111827] px-4 py-2 rounded-lg text-sm" data-tab="all">All</button>
    </div>

    <!-- Table -->
    <div class="bg-[#0f1720] rounded-xl border border-white/10 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-white/5 text-gray-300">
            <tr>
              <th class="text-left p-3">Name</th>
              <th class="text-left p-3">Role</th>
              <th class="text-left p-3">Contact</th>
              <th class="text-left p-3">Details</th>
              <th class="text-left p-3">Status</th>
              <th class="text-left p-3" id="actionsHead">Actions</th>
            </tr>
          </thead>
          <tbody id="teamTable"></tbody>
        </table>
      </div>
      <div id="emptyRow" class="hidden p-8 text-center text-gray-500 text-sm">No members in this group yet.</div>
    </div>
  </div>

  <!-- Modal -->
  <div id="modal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50 p-4">
    <div class="bg-[#0f1720] rounded-xl w-full max-w-md p-6 max-h-[90vh] overflow-auto">
      <h2 class="text-lg font-semibold mb-4" id="modalTitle">Add Member</h2>

      <!-- Common Fields -->
      <div class="space-y-3 mb-3">
        <input id="name" class="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2" placeholder="Full Name"/>
        <input id="email" class="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2" placeholder="Email (login id)"/>
        <input id="phone" class="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2" placeholder="Phone Number"/>
        <input id="password" type="password" class="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2" placeholder="Password (min 8 characters)"/>
        <p id="pwHint" class="text-xs text-gray-500 -mt-1">They sign in with this email and password. Leave blank when editing to keep the current one.</p>
        <select id="role" onchange="onRoleChange()" class="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2">
          <option value="">Select Role</option>
          <option value="agent">Agent</option>
          <option value="creator">Creator</option>
          <option value="studio">Studio</option>
          <option value="core">Core Team</option>
        </select>
      </div>

      <!-- Role-based fields -->
      <div id="agentFields" class="hidden space-y-3 mb-3">
        <input id="areas" class="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2" placeholder="Areas Covered (comma separated)"/>
        <input id="propertyTypes" class="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2" placeholder="Property Types (Villas, Flats, Plots)"/>
      </div>

      <div id="creatorFields" class="hidden space-y-3 mb-3">
        <input id="platform" class="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2" placeholder="Platform (Instagram/YouTube)"/>
        <input id="handle" class="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2" placeholder="Handle / Username"/>
      </div>

      <div id="studioFields" class="hidden space-y-3 mb-3">
        <input id="skill" class="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2" placeholder="Role (Camera / VR / Editor)"/>
        <input id="availability" class="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2" placeholder="Availability (Days/Time)"/>
      </div>

      <div id="coreFields" class="hidden space-y-3 mb-3">
        <input id="permission" class="w-full bg-black/40 border border-white/10 rounded-lg px-3 py-2" placeholder="Permission (View / Edit / Admin)"/>
      </div>

      <p id="modalErr" class="hidden text-sm text-red-400 mb-2"></p>

      <div class="flex justify-end gap-3 mt-5">
        <button onclick="toggleModal(false)" class="px-4 py-2 rounded-lg bg-white/10">Cancel</button>
        <button onclick="saveMember()" class="px-4 py-2 rounded-lg bg-blue-600" id="saveBtn">Add</button>
      </div>
    </div>
  </div>

<script src="portal-db.js"></script>
<script>
  if(!XPortal.requireModule('team')){ throw new Error('access denied'); }

  // Only the Founder may add, edit, deactivate or remove team members.
  // Every other role gets a read-only roster.
  var CAN_ADD    = XPortal.can('team.add');
  var CAN_EDIT   = XPortal.can('team.edit');
  var CAN_DELETE = XPortal.can('team.delete');

  var ROLE_LABELS = { agent:'Agent', creator:'Creator', studio:'Studio', core:'Core Team', founder:'Founder' };

  var table     = document.getElementById('teamTable');
  var emptyRow  = document.getElementById('emptyRow');
  var currentTab = 'agent';
  var editingId  = null;

  // ---------- chrome reflects permissions ----------
  document.getElementById('addBtn').style.display = CAN_ADD ? '' : 'none';
  if(!CAN_ADD) document.getElementById('lockNote').classList.remove('hidden');
  if(!CAN_EDIT && !CAN_DELETE) document.getElementById('actionsHead').style.display = 'none';
  document.getElementById('scopeNote').textContent = XPortal.can('data.viewAll')
    ? 'Full roster — every member across all roles.'
    : 'Roster is read-only for your role (' + XPortal.roleLabel() + ').';

  // ---------- render ----------
  function renderTable(role){
    table.innerHTML = '';
    var members = XPortal.list('users').filter(function(m){
      return role === 'all' ? true : (m.role || '').toLowerCase() === role;
    });

    emptyRow.classList.toggle('hidden', members.length > 0);

    members.forEach(function(m){
      var tr = document.createElement('tr');
      tr.className = 'border-t border-white/5 hover:bg-white/5';

      tr.appendChild(cell(m.name || '—', 'p-3'));
      tr.appendChild(cell(ROLE_LABELS[(m.role||'').toLowerCase()] || m.role || '—', 'p-3'));

      var contact = document.createElement('td');
      contact.className = 'p-3 text-gray-400 text-xs';
      contact.appendChild(line(m.email || '—'));
      contact.appendChild(line(m.phone || '—'));
      tr.appendChild(contact);

      tr.appendChild(cell(m.details || '—', 'p-3 text-gray-400 text-xs'));

      var active = m.active !== false;
      tr.appendChild(cell(active ? 'Active' : 'Inactive', 'p-3 ' + (active ? 'text-green-400' : 'text-red-400')));

      var act = document.createElement('td');
      act.className = 'p-3';
      if(CAN_EDIT || CAN_DELETE){
        var wrap = document.createElement('div');
        wrap.className = 'flex gap-3';

        if(CAN_EDIT){
          wrap.appendChild(actionBtn(active ? 'Deactivate' : 'Activate', 'text-blue-400', function(){
            XPortal.update('users', m.id, { active: !active });
            XPortal.audit('Founder set ' + (m.name || m.id) + ' to ' + (active ? 'inactive' : 'active'));
            renderTable(currentTab);
          }));
          wrap.appendChild(actionBtn('Edit', 'text-blue-400', function(){ openEdit(m); }));
        }
        if(CAN_DELETE){
          wrap.appendChild(actionBtn('Remove', 'text-red-400', function(){
            if(m.role === 'founder'){
              alert('The Founder account cannot be removed.');
              return;
            }
            if(m.id === XPortal.currentUser().id){
              alert('You cannot remove your own account while signed in.');
              return;
            }
            if(!confirm('Remove ' + (m.name || 'this member') + ' from the team?')) return;
            XPortal.remove('users', m.id);
            XPortal.audit('Founder removed team member ' + (m.name || m.id));
            renderTable(currentTab);
          }));
        }
        act.appendChild(wrap);
      } else {
        act.style.display = 'none';
      }
      tr.appendChild(act);

      table.appendChild(tr);
    });
  }

  function cell(text, cls){
    var td = document.createElement('td');
    td.className = cls;
    td.textContent = text;
    return td;
  }
  function line(text){
    var d = document.createElement('div');
    d.textContent = text;
    return d;
  }
  function actionBtn(text, colorCls, handler){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = colorCls + ' hover:underline text-xs';
    b.textContent = text;
    b.addEventListener('click', handler);
    return b;
  }

  // ---------- modal ----------
  function onRoleChange(){
    ['agentFields','creatorFields','studioFields','coreFields'].forEach(function(id){
      document.getElementById(id).classList.add('hidden');
    });
    var role = document.getElementById('role').value;
    var map = { agent:'agentFields', creator:'creatorFields', studio:'studioFields', core:'coreFields' };
    if(map[role]) document.getElementById(map[role]).classList.remove('hidden');
  }

  function detailsFor(role){
    var v = function(id){ return document.getElementById(id).value.trim() || '-'; };
    if(role === 'agent')   return 'Areas: ' + v('areas') + ' | Types: ' + v('propertyTypes');
    if(role === 'creator') return 'Platform: ' + v('platform') + ' | Handle: ' + v('handle');
    if(role === 'studio')  return 'Role: ' + v('skill') + ' | Availability: ' + v('availability');
    if(role === 'core')    return 'Permission: ' + v('permission');
    return '';
  }

  function showErr(msg){
    var el = document.getElementById('modalErr');
    el.textContent = msg;
    el.classList.remove('hidden');
  }
  function hideErr(){ document.getElementById('modalErr').classList.add('hidden'); }

  function clearForm(){
    document.querySelectorAll('#modal input').forEach(function(i){ i.value = ''; });
    document.getElementById('role').value = '';
    onRoleChange();
    hideErr();
  }

  function openEdit(m){
    editingId = m.id;
    document.getElementById('modalTitle').textContent = 'Edit Member';
    document.getElementById('saveBtn').textContent = 'Save';
    document.getElementById('password').placeholder = 'New password (leave blank to keep current)';
    clearForm();
    document.getElementById('name').value  = m.name || '';
    document.getElementById('email').value = m.email || '';
    document.getElementById('phone').value = m.phone || '';
    document.getElementById('role').value  = (m.role || '').toLowerCase();
    onRoleChange();
    toggleModal(true);
  }

  function toggleModal(show){
    // Guard the modal itself, not just the button, so it can't be opened
    // from the console by a non-founder role.
    if(show && !CAN_ADD && !CAN_EDIT){
      alert('Only the Founder account can add or edit team members.');
      return;
    }
    if(show && editingId === null && !CAN_ADD){
      alert('Only the Founder account can add team members.');
      return;
    }
    var modal = document.getElementById('modal');
    modal.classList.toggle('hidden', !show);
    modal.classList.toggle('flex', show);
    if(!show){
      editingId = null;
      document.getElementById('modalTitle').textContent = 'Add Member';
      document.getElementById('saveBtn').textContent = 'Add';
      document.getElementById('password').placeholder = 'Password (min 8 characters)';
      clearForm();
    }
  }

  function saveMember(){
    hideErr();
    var name  = document.getElementById('name').value.trim();
    var email = document.getElementById('email').value.trim().toLowerCase();
    var phone = document.getElementById('phone').value.trim();
    var pass  = document.getElementById('password').value;
    var role  = document.getElementById('role').value;

    if(!name || !phone || !role){
      showErr('Name, Phone and Role are required.');
      return;
    }
    // Email and password are the login: a member without both can never sign in.
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){
      showErr('A valid email is required — it is their login id.');
      return;
    }
    if(!editingId && pass.length < 8){
      showErr('Set a password of at least 8 characters so they can sign in.');
      return;
    }
    if(editingId && pass && pass.length < 8){
      showErr('The new password must be at least 8 characters.');
      return;
    }

    var users = XPortal.list('users');
    var clash = users.filter(function(u){
      return email && (u.email || '').toLowerCase() === email && u.id !== editingId;
    });
    if(clash.length){
      showErr('That email is already used by ' + clash[0].name + '.');
      return;
    }

    var saveBtn = document.getElementById('saveBtn');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';

    function done(){
      saveBtn.disabled = false;
      toggleModal(false);
      currentTab = role;
      syncTabs();
      renderTable(currentTab);
    }
    function failed(err){
      saveBtn.disabled = false;
      saveBtn.textContent = editingId ? 'Save' : 'Add';
      showErr(err.message || 'Could not save.');
    }

    if(editingId){
      if(!CAN_EDIT){ failed(new Error('Only the Founder account can edit members.')); return; }
      XPortal.update('users', editingId, {
        name: name, email: email, phone: phone, role: role, details: detailsFor(role)
      });
      XPortal.audit('Founder updated team member ' + name);
      // A blank password field means "leave the current one alone".
      (pass ? XPortal.setPassword(editingId, pass).then(function(){
                XPortal.audit('Founder reset the password for ' + name);
              })
            : Promise.resolve())
        .then(done).catch(failed);
      return;
    }

    if(!CAN_ADD){ failed(new Error('Only the Founder account can add members.')); return; }
    var id = XPortal.uid('u');
    XPortal.insert('users', {
      id: id,
      name: name,
      email: email,
      phone: phone,
      role: role,
      details: detailsFor(role),
      photo: '',
      presence: 'offline',
      active: true,
      createdAt: Date.now()
    });
    XPortal.setPassword(id, pass).then(function(){
      XPortal.audit('Founder added team member ' + name + ' (' + role + ')');
      XPortal.activity('New ' + (ROLE_LABELS[role] || role) + ' added: ' + name);
      done();
      alert(name + ' can now sign in with:\n\n  ' + email + '\n  (the password you just set)\n\n' +
            'Ask them to change it after their first login.');
    }).catch(function(err){
      // Don't leave a member behind who can never log in.
      XPortal.remove('users', id);
      failed(err);
    });
  }

  // ---------- tabs ----------
  function syncTabs(){
    document.querySelectorAll('.tab-btn').forEach(function(b){
      var on = b.dataset.tab === currentTab;
      b.classList.toggle('bg-blue-600', on);
      b.classList.toggle('bg-[#111827]', !on);
    });
  }

  document.querySelectorAll('.tab-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      currentTab = btn.dataset.tab;
      syncTabs();
      renderTable(currentTab);
    });
  });

  syncTabs();
  renderTable(currentTab);
</script>
  <script src="portal-nav.js"></script>
</body>
</html>
