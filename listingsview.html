<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Xspace &amp; Co | Listing Intelligence</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#0b0b0b;
  --panel:#0f1720;
  --fg:#fff;
  --muted:#9aa0a6;
  --border:rgba(255,255,255,0.08);
  --accent:#10b981;
  font-family: Inter, system-ui;
}
body{margin:0;background:var(--bg);color:var(--fg);}
.container{padding:20px;max-width:1100px;margin:auto;}

.section{
  background:var(--panel);
  border-radius:12px;
  padding:16px;
  margin-bottom:16px;
}
.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  flex-wrap:wrap;
}
h1{margin:0;font-size:22px;}
h3{margin:0 0 12px;font-size:16px;}
.small{font-size:13px;color:var(--muted);}

.badge{
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
  background:#64748b;
}
.badge.verified{background:#22c55e;color:#000;}
.hot{color:#ef4444;font-weight:600;}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}
@media (max-width:820px){ .grid{grid-template-columns:repeat(2,1fr);} }
@media (max-width:480px){ .grid{grid-template-columns:1fr;} }
.box{
  background:rgba(255,255,255,0.04);
  padding:12px;
  border-radius:10px;
}
.box strong{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin-bottom:2px;
}

.photo-strip{display:flex;gap:8px;flex-wrap:wrap;}
.photo-strip img{
  width:120px;height:90px;object-fit:cover;
  border-radius:8px;border:1px solid var(--border);
}
.notfound{text-align:center;color:var(--muted);padding:40px;}
.notfound a{color:var(--accent);}
</style>
</head>

<body>
<div class="container">

<div id="notFound" class="section notfound" style="display:none">
  This listing could not be found. <a href="listings.html">Back to Listings</a>
</div>

<div id="content" style="display:none">

  <!-- HEADER -->
  <div class="section header">
    <div>
      <h1 id="lTitle">—</h1>
      <div class="small" id="lArea"></div>
      <div class="small" id="lSubmitted"></div>
    </div>
    <div><span class="badge" id="lBadge">—</span></div>
  </div>

  <!-- PHOTOS -->
  <div class="section" id="photoSection" style="display:none">
    <h3>Photos</h3>
    <div class="photo-strip" id="photoStrip"></div>
  </div>

  <!-- PROJECT SNAPSHOT -->
  <div class="section">
    <h3>Project Snapshot</h3>
    <div class="grid">
      <div class="box"><strong>Project</strong><span id="pName">—</span></div>
      <div class="box"><strong>Builder</strong><span id="pBuilder">—</span></div>
      <div class="box"><strong>RERA</strong><span id="pRera">—</span></div>
      <div class="box"><strong>Status</strong><span id="pStatus">—</span></div>
    </div>
  </div>

  <!-- UNIT DETAILS -->
  <div class="section">
    <h3>Unit Details</h3>
    <div class="grid">
      <div class="box"><strong>Configuration</strong><span id="uType">—</span></div>
      <div class="box"><strong>Area</strong><span id="uArea">—</span></div>
      <div class="box"><strong>Price</strong><span id="uPrice">—</span></div>
      <div class="box"><strong>Availability</strong><span id="uStatus">—</span></div>
    </div>
  </div>

  <!-- CLIENT INTEREST -->
  <div class="section">
    <h3>Client Interest</h3>
    <div class="small" id="interestList">No clients linked to this listing yet.</div>
  </div>

  <!-- SITE VISITS -->
  <div class="section">
    <h3>Site Visits</h3>
    <div class="small" id="visitList">No site visits recorded for this listing.</div>
  </div>

</div>
</div>

  <script src="portal-db.js"></script>
  <script>
  if(!XPortal.requireModule('listings')){ throw new Error('access denied'); }

  var id = new URLSearchParams(window.location.search).get('id');
  var l  = id ? XPortal.find('listings', id) : null;
  var ME = XPortal.currentUser();

  // Founder can open any listing; everyone else only their own.
  var mine = l && (l.submittedBy === ME.id || l.assignedAgent === ME.id);

  if(!l || !(XPortal.can('data.viewAll') || mine)){
    document.getElementById('notFound').style.display = 'block';
    if(l) document.getElementById('notFound').textContent = 'You do not have access to this listing.';
  } else {
    document.getElementById('content').style.display = 'block';
    render();
  }

  function set(elId, text){
    var el = document.getElementById(elId);
    if(el) el.textContent = text || '—';
  }

  function render(){
    set('lTitle', l.title);
    set('lArea', l.area ? '📍 ' + l.area : '');
    set('lSubmitted', 'Submitted by: ' + XPortal.userName(l.submittedBy || l.assignedAgent));

    var badge = document.getElementById('lBadge');
    badge.textContent = l.verified ? 'Verified' : 'Unverified';
    badge.className = 'badge' + (l.verified ? ' verified' : '');

    var p = l.projectId ? XPortal.find('projects', l.projectId) : null;
    set('pName',    p && p.name);
    set('pBuilder', p && p.builder);
    set('pRera',    p && p.rera);
    set('pStatus',  p && p.status);

    set('uType',   l.unitType);
    set('uArea',   l.area);
    set('uPrice',  l.price);
    set('uStatus', l.status);

    var photos = l.photos || [];
    if(photos.length){
      document.getElementById('photoSection').style.display = 'block';
      var strip = document.getElementById('photoStrip');
      photos.forEach(function(ph, i){
        var img = document.createElement('img');
        // `url` once photos live in Supabase Storage; `thumb` while local.
        img.src = ph.url || ph.thumb;
        img.alt = (l.title || 'Listing') + ' photo ' + (i + 1);
        img.loading = 'lazy';
        strip.appendChild(img);
      });
    }

    var leads = XPortal.scoped('leads', ['assignedAgent'])
                       .filter(function(c){ return c.listingId === l.id; });
    if(leads.length){
      var host = document.getElementById('interestList');
      host.textContent = '';
      leads.forEach(function(c){
        var d = document.createElement('div');
        d.textContent = '• ' + c.name + ' — ' + (c.status || '') +
                        (c.budget ? ' • ' + c.budget : '');
        host.appendChild(d);
      });
    }

    var visits = XPortal.scoped('visits', ['agentId'])
                        .filter(function(v){ return v.listingId === l.id; });
    if(visits.length){
      var vh = document.getElementById('visitList');
      vh.textContent = '';
      visits.forEach(function(v){
        var d = document.createElement('div');
        d.textContent = '• ' + new Date(v.scheduledAt).toLocaleString() +
                        ' — ' + XPortal.userName(v.agentId) +
                        ' (' + (v.status || 'Scheduled') + ')';
        vh.appendChild(d);
      });
    }
  }
  </script>
  <script src="portal-nav.js"></script>
</body>
</html>
